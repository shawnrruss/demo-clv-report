[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clvreport"
version = "0.1.0"
description = "Demo closing-line-value report for a CSV of placed bets (simulated data only)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6", "pillow>=10.1"]

[project.scripts]
clvreport = "clvreport.cli:main"

[tool.setuptools]
packages = ["clvreport"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
